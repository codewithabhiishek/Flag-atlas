<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Ocean Globe Gradient (Luminous Sapphire & Cyan) -->
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>

    <!-- Golden Pole & Finial Gradient -->
    <linearGradient id="goldPole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Vibrant Sunset Pennant Flag Gradient (Neutral, High-Energy Exploration) -->
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Outer Shadow for Crisp Contrast on Light & Dark Tabs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- 1. The Globe (Atlas Sphere) -->
    <circle cx="32" cy="38" r="21" fill="url(#globeGrad)" stroke="#BAE6FD" stroke-width="1.8" />

    <!-- 2. Globe Latitude lines (Crisp white arcs) -->
    <ellipse cx="32" cy="38" rx="21" ry="8" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" fill="none" />
    <ellipse cx="32" cy="29" rx="17" ry="5.5" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.45" stroke-dasharray="2 1.5" fill="none" />
    <ellipse cx="32" cy="47" rx="17" ry="5.5" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.45" stroke-dasharray="2 1.5" fill="none" />

    <!-- 3. Globe Longitude line (Prime meridian curve) -->
    <ellipse cx="32" cy="38" rx="11" ry="21" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" fill="none" />
    <line x1="32" y1="17" x2="32" y2="59" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.45" />

    <!-- 4. Glowing landmass continents (stylized vibrant mint accents) -->
    <path d="M 18 30 Q 21 34, 19 42 Q 22 47, 24 45 Q 26 40, 24 32 Z" fill="#34D399" fill-opacity="0.85" />
    <path d="M 33 25 Q 40 24, 43 30 Q 42 38, 38 41 Q 33 43, 34 33 Z" fill="#34D399" fill-opacity="0.85" />

    <!-- 5. Golden Flagpole planted into the Globe -->
    <line x1="24.5" y1="6" x2="24.5" y2="40" stroke="#000000" stroke-width="2.5" stroke-opacity="0.25" stroke-linecap="round" />
    <line x1="23.5" y1="6" x2="23.5" y2="39" stroke="url(#goldPole)" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="23.5" cy="5" r="3.2" fill="#FDE047" stroke="#B45309" stroke-width="0.8" />

    <!-- 6. Bold Exploration Flag (Dynamic Waving Pennant) -->
    <path d="M 24.8 6.5 C 34 4, 44 11, 56 7.5 L 48 16 L 56 24.5 C 44 21, 34 28, 24.8 25.5 Z" fill="url(#flagGrad)" stroke="#FFE4E6" stroke-width="1" />

    <!-- Flag Inner Compass Star (Exploration & Navigation) -->
    <path d="M 36 12 L 37.5 14.8 L 40.5 16 L 37.5 17.2 L 36 20 L 34.5 17.2 L 31.5 16 L 34.5 14.8 Z" fill="#FEF08A" />
    <circle cx="36" cy="16" r="1.1" fill="#FFFFFF" />
  </g>
</svg>
