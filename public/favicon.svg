<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Ocean Gradient (Luminous Sapphire & Cyan) -->
    <radialGradient id="oceanGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </radialGradient>

    <!-- Golden Compass Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadow for High Contrast on Dark/Light Tabs -->
    <filter id="globeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#globeShadow)">
    <!-- 1. Atlas Globe Outer Rim -->
    <circle cx="32" cy="32" r="27" fill="url(#oceanGrad)" stroke="#BAE6FD" stroke-width="2.5" />

    <!-- 2. Continents / Landmasses (Stylized Emerald) -->
    <!-- Americas -->
    <path d="M 18 20 C 23 20, 24 28, 20 34 C 18 37, 23 44, 25 43 C 27 38, 26 31, 23 24 C 21 21, 20 18, 18 20 Z" fill="#34D399" opacity="0.9" />
    <!-- Eurasia & Africa -->
    <path d="M 33 16 C 42 15, 48 20, 47 27 C 46 32, 49 35, 45 42 C 40 45, 37 38, 38 31 C 36 26, 33 22, 33 16 Z" fill="#34D399" opacity="0.9" />
    <!-- Australia / Oceania -->
    <ellipse cx="46" cy="46" rx="4" ry="3" fill="#34D399" opacity="0.9" />

    <!-- 3. Globe Meridian & Latitude Grid Lines -->
    <!-- Equator -->
    <ellipse cx="32" cy="32" rx="27" ry="9" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.6" fill="none" />
    <!-- Northern & Southern Parallels -->
    <ellipse cx="32" cy="21" rx="23" ry="6.5" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 2" fill="none" />
    <ellipse cx="32" cy="43" rx="23" ry="6.5" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 2" fill="none" />
    <!-- Prime Meridian Arc -->
    <ellipse cx="32" cy="32" rx="14" ry="27" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.6" fill="none" />
    <line x1="32" y1="5" x2="32" y2="59" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- 4. Atlas Compass Rose / Exploration Star (Navigation Centerpiece) -->
    <!-- Outer Compass Dial Ring -->
    <circle cx="32" cy="32" r="11" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.85" />
    
    <!-- 8-Point Compass Star -->
    <!-- North Pointer (Golden & White 3D bevel) -->
    <polygon points="32,15 34.5,30 32,32" fill="#FDE047" />
    <polygon points="32,15 29.5,30 32,32" fill="#D97706" />

    <!-- South Pointer -->
    <polygon points="32,49 34.5,34 32,32" fill="#D97706" />
    <polygon points="32,49 29.5,34 32,32" fill="#FDE047" />

    <!-- East Pointer -->
    <polygon points="49,32 34,34.5 32,32" fill="#FDE047" />
    <polygon points="49,32 34,29.5 32,32" fill="#D97706" />

    <!-- West Pointer -->
    <polygon points="15,32 30,34.5 32,32" fill="#D97706" />
    <polygon points="15,32 30,29.5 32,32" fill="#FDE047" />

    <!-- Intermediate 4 Points (Subtle Gold) -->
    <polygon points="43,21 33.5,30.5 32,32" fill="#FDE047" opacity="0.9" />
    <polygon points="43,21 30.5,33.5 32,32" fill="#B45309" opacity="0.9" />
    <polygon points="21,43 30.5,33.5 32,32" fill="#FDE047" opacity="0.9" />
    <polygon points="21,43 33.5,30.5 32,32" fill="#B45309" opacity="0.9" />
    <polygon points="43,43 33.5,33.5 32,32" fill="#FDE047" opacity="0.9" />
    <polygon points="43,43 30.5,30.5 32,32" fill="#B45309" opacity="0.9" />
    <polygon points="21,21 30.5,30.5 32,32" fill="#FDE047" opacity="0.9" />
    <polygon points="21,21 33.5,33.5 32,32" fill="#B45309" opacity="0.9" />

    <!-- Center Pivot Jewel -->
    <circle cx="32" cy="32" r="3.2" fill="#FFFFFF" stroke="#D97706" stroke-width="1" />
    <circle cx="32" cy="32" r="1.4" fill="#F59E0B" />
  </g>
</svg>
